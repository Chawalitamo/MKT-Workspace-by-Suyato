<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJx Team Schedule</title>
<script src="./index_files/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI',Arial,sans-serif; background: #0f0f11; min-height: 100vh; color: #f2f2f7; }
.tab-bar { display: flex; align-items: center; background: #0a0a0c; padding: 0 1rem 0 1.2rem; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #1e1e22; gap: 4px; }
.tab-logo { height: 28px; width: auto; margin-right: 10px; flex-shrink: 0; opacity: 0.95; }
.tab-btn { padding: 14px 18px; color: #666; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; }
.tab-btn.active { color: #fff; border-bottom-color: #D85A30; }
.tab-btn:hover:not(.active) { color: #aaa; }
.page { display: none; }
.page.active { display: block; }

/* ─── ENTRY PAGE ──────────────────────────────────────── */
.form-wrap { max-width: 540px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.card { background: #1c1c1e; border-radius: 14px; padding: 1.5rem; box-shadow: 0 1px 12px rgba(0,0,0,0.35); margin-bottom: 1rem; border: 1px solid #2a2a2e; }
.card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: #666; margin-bottom: 12px; }
label { display: block; font-size: 13px; font-weight: 500; color: #8e8e93; margin-bottom: 5px; }
.req { color: #D85A30; margin-left: 2px; }
input[type=text], input[type=time], input[type=date], select, textarea {
  width: 100%; padding: 10px 12px; border: 1.5px solid #38383c; border-radius: 8px;
  font-size: 14px; font-family: inherit; color: #f2f2f7; background: #242428;
  transition: border 0.15s; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: #D85A30; background: #2c2c30; }
input::placeholder, textarea::placeholder { color: #48484a; }
/* date/time picker icons need to be light in dark mode */
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(0.5); cursor: pointer; }
textarea { min-height: 72px; resize: vertical; }
select option { background: #242428; color: #f2f2f7; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { margin-bottom: 1rem; }
.field:last-child { margin-bottom: 0; }
.tm-row { display: flex; gap: 8px; }
.tm-pill { flex: 1; padding: 10px 8px; border: 2px solid #38383c; border-radius: 10px; background: #242428; cursor: pointer; text-align: center; font-size: 14px; font-weight: 600; color: #8e8e93; transition: all 0.15s; }
.tm-pill .av { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.tm-pill.active { border-color: #D85A30; background: #2d1a12; color: #E8805A; }
.brand-row { display: flex; gap: 8px; flex-wrap: wrap; }
.brand-btn { padding: 7px 14px; border-radius: 20px; border: 1.5px solid #38383c; font-size: 13px; font-weight: 600; cursor: pointer; background: #242428; color: #8e8e93; transition: all 0.15s; }
.brand-btn.active { border-color: transparent; }
.b-CJX.active { background: #E8A000; color: #1a0e00; }
.b-TD.active  { background: #5C2D0A; color: #fff; }
.b-Cafe.active{ background: #185FA5; color: #fff; }
.b-HR.active  { background: #3BA55C; color: #fff; }
.b-OPR.active { background: #533AB7; color: #fff; }
.b-Others.active { background: #555; color: #fff; }
.others-input { margin-top: 8px; display: none; }
.others-input.show { display: block; }
.date-hint { font-size: 11px; color: #48484a; margin-top: 4px; }
.submit-btn { width: 100%; padding: 14px; background: #D85A30; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.15s; font-family: inherit; margin-top: 0.25rem; }
.submit-btn:hover { background: #b84a24; }
.submit-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
.my-entries { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #2a2a2e; }

/* ─── TOAST ───────────────────────────────────────────── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2c2c30; color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; border: 1px solid #3a3a3e; }
.toast.show { opacity: 1; }
.toast.ok  { background: #0F6E56; border-color: #1a8866; }
.toast.err { background: #A32D2D; border-color: #c03535; }

/* ─── CALENDAR PAGE ───────────────────────────────────── */
.cal-wrap { padding: 1rem 1rem 4rem; max-width: 1100px; margin: 0 auto; }

/* Top control bar */
.cal-topbar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px; margin-bottom: 0.9rem;
  background: #1c1c1e; border-radius: 14px; padding: 12px 16px;
  box-shadow: 0 1px 10px rgba(0,0,0,0.4); border: 1px solid #2a2a2e;
}
.cal-title-area { display: flex; align-items: center; gap: 10px; }
.cal-topbar h2 { font-size: 18px; font-weight: 800; color: #f2f2f7; letter-spacing: -0.3px; }
.live-badge { font-size: 11px; color: #3BA55C; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #3BA55C; display: inline-block; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
.nav-controls { display: flex; align-items: center; gap: 6px; }
.nav-btn { width: 32px; height: 32px; border: 1.5px solid #38383c; border-radius: 8px; background: #242428; cursor: pointer; font-size: 17px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; color: #8e8e93; }
.nav-btn:hover { background: #2c2c30; border-color: #48484a; color: #f2f2f7; }
.month-lbl { font-size: 15px; font-weight: 800; color: #f2f2f7; min-width: 148px; text-align: center; }
.today-btn { padding: 5px 12px; border: 1.5px solid #38383c; border-radius: 8px; background: #242428; cursor: pointer; font-size: 12px; font-weight: 600; color: #8e8e93; transition: all 0.15s; font-family: inherit; }
.today-btn:hover { border-color: #D85A30; color: #D85A30; background: #2d1a12; }

/* Filter + stats row */
.filter-stats-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 0.9rem; }
.filter-chips { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.filter-chips span { font-size: 12px; color: #48484a; font-weight: 600; }
.fchip { padding: 5px 14px; border-radius: 20px; border: 1.5px solid #38383c; font-size: 12px; cursor: pointer; font-weight: 700; background: #242428; color: #8e8e93; transition: all 0.15s; }
.fchip.f-all.active   { background: #f2f2f7; border-color: #f2f2f7; color: #0f0f11; }
.fchip.f-Toon.active  { background: #D85A30; border-color: #D85A30; color: #fff; }
.fchip.f-Wit.active   { background: #3BA55C; border-color: #3BA55C; color: #fff; }
.fchip.f-Ju.active    { background: #185FA5; border-color: #185FA5; color: #fff; }
.mini-stats { display: flex; gap: 12px; }
.mstat { display: flex; align-items: center; gap: 5px; background: #1c1c1e; border: 1px solid #2a2a2e; border-radius: 8px; padding: 5px 10px; }
.mstat-n { font-size: 16px; font-weight: 800; color: #f2f2f7; }
.mstat-l { font-size: 10px; color: #48484a; font-weight: 600; }

/* Calendar grid */
.cal-grid-wrap {
  background: #1c1c1e; border-radius: 14px; overflow: hidden;
  border: 1px solid #2a2a2e; margin-bottom: 1rem;
  box-shadow: 0 1px 12px rgba(0,0,0,0.3);
}
.cal-body { overflow-x: auto; }
.cal-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.cal-th {
  text-align: center; padding: 10px 4px; font-size: 11px; font-weight: 700;
  color: #8e8e93; background: #111113; letter-spacing: 0.06em; text-transform: uppercase;
  width: 14.285%; border-bottom: 1px solid #2a2a2e;
}
.cal-th.wknd-th { background: #161618; color: #48484a; }
.cal-cell { vertical-align: top; border-right: 1px solid #222226; border-bottom: 1px solid #222226; padding: 6px 5px; height: 110px; background: #1c1c1e; }
.cal-table tr td:last-child { border-right: none; }
.cal-cell.empty   { background: #161618; }
.cal-cell.weekend { background: #181819; }
.cal-cell.today   { background: #2a1a0f; border-top: 2px solid #D85A30; }
.cal-cell.drag-over { background: #2d1810 !important; outline: 2px dashed #D85A30; outline-offset: -2px; }
.date-n {
  font-size: 12px; font-weight: 700; color: #38383c;
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px; transition: background 0.1s;
}
.date-n.has-ev { color: #8e8e93; }
.date-n.td-c   { background: #D85A30; color: #fff; }

/* Event pills */
.epill {
  font-size: 10px; padding: 2px 5px 2px 7px; border-radius: 4px;
  margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; max-width: 100%; font-weight: 600;
  line-height: 1.5; display: block; border-left: 2px solid transparent;
}
.p-Toon { background: #2d1a12; color: #E8805A; border-left-color: #D85A30; }
.p-Wit  { background: #0e2318; color: #5CC88A; border-left-color: #3BA55C; }
.p-Ju   { background: #0d1e33; color: #5AABEE; border-left-color: #2A7FCC; }
.epill[draggable="true"] { cursor: grab; }
.epill[draggable="true"]:active { opacity: 0.6; }
.more-b { font-size: 10px; color: #38383c; padding-left: 4px; margin-top: 2px; }

/* Work log section */
.detail-section { background: #1c1c1e; border-radius: 14px; border: 1px solid #2a2a2e; overflow: hidden; box-shadow: 0 1px 10px rgba(0,0,0,0.3); }
.detail-section-hd {
  padding: 13px 16px; border-bottom: 1px solid #222226;
  display: flex; align-items: center; justify-content: space-between;
}
.sec-hd { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #48484a; }
.detail-inner { padding: 10px 12px 4px; }
.loading { text-align: center; padding: 32px; color: #48484a; font-size: 13px; }

/* Date group headers */
.date-group { margin-bottom: 10px; }
.dg-hd {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 0 7px; border-bottom: 1px solid #222226; margin-bottom: 5px;
}
.dg-day {
  background: #2c2c30; color: #f2f2f7; border-radius: 5px;
  padding: 2px 7px; font-size: 10px; font-weight: 800; letter-spacing: 0.04em;
}
.dg-day.wknd { background: #242428; color: #8e8e93; }
.dg-date { font-size: 12px; font-weight: 700; color: #8e8e93; }
.dg-count { font-size: 10px; color: #48484a; margin-left: auto; }

/* Log entries */
.dentry {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 10px; border-radius: 8px; margin-bottom: 4px;
  border: 1px solid #2a2a2e; background: #242428;
  transition: background 0.12s, border-color 0.12s;
}
.dentry:hover { background: #2c2c30; border-color: #38383c; }
.dentry[draggable="true"] { cursor: grab; }
.dentry[draggable="true"]:active { opacity: 0.6; }
.dav { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
.av-Toon { background: #4d1e0a; color: #E8805A; }
.av-Wit  { background: #0e2e14; color: #5CC88A; }
.av-Ju   { background: #0d1e33; color: #5AABEE; }
.di { flex: 1; min-width: 0; }
.di-t { font-size: 13px; font-weight: 600; color: #f2f2f7; line-height: 1.3; }
.di-m { font-size: 11px; color: #666; margin-top: 2px; line-height: 1.5; }
.di-time { font-size: 10px; font-weight: 700; color: #8e8e93; background: #2c2c30; border-radius: 4px; padding: 1px 5px; margin-right: 4px; }
.dbadge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
.bb-CJX    { background: #2d2000; color: #E8A000; }
.bb-TD     { background: #1e0e00; color: #BB6030; }
.bb-Cafe   { background: #0d1e33; color: #5AABEE; }
.bb-HR     { background: #0e2318; color: #5CC88A; }
.bb-OPR    { background: #1a1030; color: #9B80E8; }
.bb-Others { background: #2a2a2e; color: #8e8e93; }
.del-btn { border: none; background: none; cursor: pointer; color: #38383c; font-size: 15px; padding: 0 4px; transition: color .15s; }
.del-btn:hover { color: #D85A30; }

@media(max-width:600px){
  .cal-cell { padding: 3px 2px; }
  .epill { font-size: 9px; padding: 1px 4px 1px 6px; }
  .tab-btn { padding: 12px 12px; font-size: 13px; }
  .tab-logo { height: 22px; margin-right: 6px; }
  .mini-stats { display: none; }
  .cal-cell { height: 70px; }
}
</style>
</head>
<body>

<div class="tab-bar">
  <img src="./logo.png" class="tab-logo" alt="CJx">
  <div class="tab-btn active" onclick="switchTab('entry',this)">📝 Log Work</div>
  <div class="tab-btn" onclick="switchTab('calendar',this)">📅 Team Calendar</div>
</div>

<!-- ENTRY PAGE -->
<div id="page-entry" class="page active">
<div class="form-wrap">

  <div class="card">
    <div class="card-title">Team Member <span class="req">*</span></div>
    <div class="tm-row">
      <div class="tm-pill" data-name="Toon" onclick="selectTM(this)">
        <div class="av" style="background:#4d1e0a;color:#E8805A">T</div>Toon
      </div>
      <div class="tm-pill" data-name="Wit" onclick="selectTM(this)">
        <div class="av" style="background:#0e2e14;color:#5CC88A">W</div>Wit
      </div>
      <div class="tm-pill" data-name="Ju" onclick="selectTM(this)">
        <div class="av" style="background:#0d1e33;color:#5AABEE">J</div>Ju
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Work Details</div>
    <div class="field">
      <label>Date <span class="req">*</span></label>
      <div class="row2">
        <div>
          <label style="font-size:11px;color:#48484a;margin-bottom:3px;">From</label>
          <input type="date" id="date_from" onchange="syncDateTo()" min="2026-06-01">
        </div>
        <div>
          <label style="font-size:11px;color:#48484a;margin-bottom:3px;">To</label>
          <input type="date" id="date_to" min="2026-06-01">
        </div>
      </div>
      <div class="date-hint">For a single day, fill in From date only</div>
    </div>
    <div class="field row2">
      <div><label>Start Time</label><input type="time" id="start_time"></div>
      <div><label>End Time</label><input type="time" id="end_time"></div>
    </div>
    <div class="field">
      <label>Task Title <span class="req">*</span></label>
      <input type="text" id="title" placeholder="e.g. Shoot CJX clip post 16, Live TD">
    </div>
    <div class="field">
      <label>Work Type</label>
      <input type="text" id="event_type" placeholder="e.g. Photo shoot, Edit clip, Live, Meeting...">
    </div>
    <div class="field">
      <label>Location</label>
      <input type="text" id="location" placeholder="e.g. Studio, On-site, WFH">
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="notes" placeholder="Additional details..."></textarea>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Brand</div>
    <div class="brand-row">
      <div class="brand-btn b-CJX"    data-brand="CJX"    onclick="selectBrand(this)">CJX</div>
      <div class="brand-btn b-TD"     data-brand="TD"     onclick="selectBrand(this)">TD</div>
      <div class="brand-btn b-Cafe"   data-brand="Cafe"   onclick="selectBrand(this)">Cafe</div>
      <div class="brand-btn b-HR"     data-brand="HR"     onclick="selectBrand(this)">HR</div>
      <div class="brand-btn b-OPR"    data-brand="OPR"    onclick="selectBrand(this)">OPR</div>
      <div class="brand-btn b-Others" data-brand="Others" onclick="selectBrand(this)">Others</div>
    </div>
    <div class="others-input" id="others-input">
      <input type="text" id="others_name" placeholder="Specify brand name...">
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitEntry()">✓ Save Schedule</button>

  <div class="my-entries" id="myEntriesSection" style="display:none">
    <div class="card-title" style="margin-bottom:10px;">My Recent Entries</div>
    <div id="myEntriesList"></div>
  </div>

</div>
</div>

<!-- CALENDAR PAGE -->
<div id="page-calendar" class="page">
<div class="cal-wrap">

  <!-- Top control bar -->
  <div class="cal-topbar">
    <div class="cal-title-area">
      <h2>Team Calendar</h2>
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
    </div>
    <div class="nav-controls">
      <button class="today-btn" onclick="jumpToToday()">Today</button>
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-lbl" id="monthLbl">June 2026</div>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <!-- Filter chips + mini stats -->
  <div class="filter-stats-row">
    <div class="filter-chips">
      <span>Show:</span>
      <div class="fchip f-all active" data-f="all"  onclick="setFilter(this)">All</div>
      <div class="fchip f-Toon"       data-f="Toon" onclick="setFilter(this)">Toon</div>
      <div class="fchip f-Wit"        data-f="Wit"  onclick="setFilter(this)">Wit</div>
      <div class="fchip f-Ju"         data-f="Ju"   onclick="setFilter(this)">Ju</div>
    </div>
    <div class="mini-stats">
      <div class="mstat"><div class="mstat-n" id="s-total">—</div><div class="mstat-l">Total</div></div>
      <div class="mstat"><div class="mstat-n" style="color:#D85A30" id="s-toon">—</div><div class="mstat-l">Toon</div></div>
      <div class="mstat"><div class="mstat-n" style="color:#3BA55C" id="s-wit">—</div><div class="mstat-l">Wit</div></div>
      <div class="mstat"><div class="mstat-n" style="color:#2A7FCC" id="s-ju">—</div><div class="mstat-l">Ju</div></div>
    </div>
  </div>

  <!-- Calendar grid -->
  <div class="cal-grid-wrap">
    <div class="cal-body" id="calBody">
      <div class="loading">Loading…</div>
    </div>
  </div>

  <!-- Work log (grouped by date) -->
  <div class="detail-section">
    <div class="detail-section-hd">
      <div class="sec-hd">Work Log — <span id="logMonthLbl"></span></div>
    </div>
    <div class="detail-inner" id="detailList">
      <div class="loading">Loading…</div>
    </div>
  </div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://fxmigukayxvieziseqil.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4bWlndWtheXh2aWV6aXNlcWlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0Mjg5NzcsImV4cCI6MjA5NTAwNDk3N30.ZGqBI_QfJdp68hYBxW0rw78Z2u9tIV5Ru3AFydYozEA';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let selectedTM = null, selectedBrand = null;
let calDate = new Date(); calDate.setDate(1);   // default = this month
let calData = [], calFilter = 'all';

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ── TAB / TOAST ─────────────────────────────────────── */
function switchTab(tab, el) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'calendar') loadCalData();
}
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2800);
}

/* ── ENTRY PAGE ─────────────────────────────────────── */
function selectTM(el) {
  document.querySelectorAll('.tm-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active'); selectedTM = el.dataset.name;
  loadMyEntries();
  document.getElementById('myEntriesSection').style.display = 'block';
}
function selectBrand(el) {
  document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active'); selectedBrand = el.dataset.brand;
  document.getElementById('others-input').className = 'others-input' + (selectedBrand === 'Others' ? ' show' : '');
}
function syncDateTo() {
  const from = document.getElementById('date_from').value;
  const to = document.getElementById('date_to');
  if (from && (!to.value || to.value < from)) to.value = from;
  to.min = from;
}
function getBrand() {
  if (!selectedBrand) return null;
  if (selectedBrand === 'Others') { const v = document.getElementById('others_name').value.trim(); return v || 'Others'; }
  return selectedBrand;
}
async function submitEntry() {
  if (!selectedTM) return toast('Please select a team member', 'err');
  const dateFrom = document.getElementById('date_from').value;
  const dateTo   = document.getElementById('date_to').value || dateFrom;
  const title    = document.getElementById('title').value.trim();
  if (!dateFrom) return toast('Please select a date', 'err');
  if (!title)    return toast('Please enter a task title', 'err');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  const rows = [];
  let cur = new Date(dateFrom + 'T00:00:00');
  const end = new Date(dateTo + 'T00:00:00');
  while (cur <= end) {
    rows.push({
      teammate: selectedTM,
      event_date: cur.toISOString().slice(0,10),
      start_time: document.getElementById('start_time').value || null,
      end_time:   document.getElementById('end_time').value || null,
      title, brand: getBrand(),
      event_type: document.getElementById('event_type').value.trim() || null,
      location:   document.getElementById('location').value.trim() || null,
      notes:      document.getElementById('notes').value.trim() || null,
    });
    cur.setDate(cur.getDate() + 1);
  }
  const { error } = await sb.from('team_schedules').insert(rows);
  btn.disabled = false; btn.textContent = '✓ Save Schedule';
  if (error) return toast('Error: ' + error.message, 'err');
  toast('Saved' + (rows.length > 1 ? ' ' + rows.length + ' days' : '') + ' ✓', 'ok');
  ['date_from','date_to','start_time','end_time','title','event_type','location','notes','others_name']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  document.getElementById('date_from').value = dateFrom;
  document.getElementById('date_to').value   = dateFrom;
  document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('others-input').className = 'others-input';
  selectedBrand = null; loadMyEntries();
}
const brandColor = { CJX:'#E8A000', TD:'#BB6030', Cafe:'#2A7FCC', HR:'#3BA55C', OPR:'#7B5FD0', Others:'#666' };
async function loadMyEntries() {
  if (!selectedTM) return;
  const list = document.getElementById('myEntriesList');
  list.innerHTML = '<div class="loading">Loading...</div>';
  const { data } = await sb.from('team_schedules').select('*').eq('teammate', selectedTM)
    .gte('event_date','2026-06-01').order('event_date', { ascending: false }).limit(8);
  if (!data || !data.length) { list.innerHTML = '<div class="loading" style="padding:16px">No entries yet</div>'; return; }
  list.innerHTML = data.map(e => `
    <div class="dentry">
      <div style="width:8px;height:8px;border-radius:50%;background:${brandColor[e.brand]||'#555'};margin-top:5px;flex-shrink:0"></div>
      <div class="di">
        <div class="di-t">${e.title}</div>
        <div class="di-m">${e.event_date}${e.start_time?' · '+e.start_time.slice(0,5):''}${e.brand?' · '+e.brand:''}${e.event_type?' · '+e.event_type:''}</div>
      </div>
      <button class="del-btn" onclick="delEntry('${e.id}')">×</button>
    </div>`).join('');
}
async function delEntry(id) {
  if (!confirm('Delete this entry?')) return;
  await sb.from('team_schedules').delete().eq('id', id);
  loadMyEntries(); toast('Deleted');
}

/* ── CALENDAR ────────────────────────────────────────── */
function updateMonthLbl() {
  const label = MONTHS[calDate.getMonth()] + ' ' + calDate.getFullYear();
  document.getElementById('monthLbl').textContent = label;
  document.getElementById('logMonthLbl').textContent = label;
}
function jumpToToday() {
  calDate = new Date(); calDate.setDate(1);
  loadCalData();
}
function changeMonth(d) {
  calDate = new Date(calDate.getFullYear(), calDate.getMonth() + d, 1);
  loadCalData();
}
function setFilter(el) {
  document.querySelectorAll('.fchip').forEach(c => c.classList.remove('active'));
  el.classList.add('active'); calFilter = el.dataset.f;
  renderCal(); renderDetail();
}
function getFiltered() {
  return calFilter === 'all' ? calData : calData.filter(e => e.teammate === calFilter);
}
async function loadCalData() {
  updateMonthLbl();
  const y = calDate.getFullYear(), m = calDate.getMonth();
  const start = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const lastD = new Date(y, m+1, 0).getDate();
  const end   = `${y}-${String(m+1).padStart(2,'0')}-${lastD}`;
  const { data } = await sb.from('team_schedules').select('*')
    .gte('event_date', start).lte('event_date', end)
    .order('event_date').order('start_time');
  calData = data || [];
  updateStats(); renderCal(); renderDetail();
}
function updateStats() {
  document.getElementById('s-total').textContent = calData.length;
  document.getElementById('s-toon').textContent  = calData.filter(e=>e.teammate==='Toon').length;
  document.getElementById('s-wit').textContent   = calData.filter(e=>e.teammate==='Wit').length;
  document.getElementById('s-ju').textContent    = calData.filter(e=>e.teammate==='Ju').length;
}

/* ── RENDER CALENDAR GRID (HTML table — no CSS layout ambiguity) ── */
function renderCal() {
  const y = calDate.getFullYear(), m = calDate.getMonth();
  const lastD        = new Date(y, m+1, 0).getDate();
  const today        = new Date();
  const byDate       = {};
  getFiltered().forEach(e => { (byDate[e.event_date] = byDate[e.event_date]||[]).push(e); });

  // firstColMon: how many blank cells before day 1 (Mon=0 … Sun=6)
  const firstDow     = new Date(y, m, 1).getDay();   // 0=Sun…6=Sat
  const firstColMon  = (firstDow + 6) % 7;           // 0=Mon-start … 6=Sun-start
  const totalCells   = firstColMon + lastD;
  const numRows      = Math.ceil(totalCells / 7);

  // Build thead
  let html = '<table class="cal-table"><thead><tr>';
  ['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach((h, i) => {
    html += `<th class="cal-th${i >= 5 ? ' wknd-th' : ''}">${h}</th>`;
  });
  html += '</tr></thead><tbody>';

  // Build rows — position is 100% determined by DOM loop, no CSS magic
  for (let row = 0; row < numRows; row++) {
    html += '<tr>';
    for (let col = 0; col < 7; col++) {
      const cellIdx = row * 7 + col;
      const d       = cellIdx - firstColMon + 1;
      if (d < 1 || d > lastD) {
        html += `<td class="cal-cell empty${col >= 5 ? ' weekend' : ''}"></td>`;
      } else {
        const ds      = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dow     = new Date(y, m, d).getDay();
        const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
        const isWknd  = dow === 0 || dow === 6;
        const evs     = byDate[ds] || [];
        const shown   = evs.slice(0, 3), more = evs.length - 3;
        const hasEv   = evs.length > 0 ? ' has-ev' : '';
        html += `<td class="cal-cell${isToday?' today':(isWknd?' weekend':'')}" ondragover="calDragOver(event)" ondragleave="calDragLeave(event)" ondrop="dropOnDate(event,'${ds}')">`;
        html += `<div class="date-n${isToday?' td-c':hasEv}">${d}</div>`;
        shown.forEach(e => {
          const lbl = (e.start_time ? e.start_time.slice(0,5)+' ':'') + e.title;
          html += `<span class="epill p-${e.teammate}" title="${e.teammate}: ${e.title}" draggable="true" ondragstart="dragStart(event,'${e.id}')">${lbl}</span>`;
        });
        if (more > 0) html += `<div class="more-b">+${more} more</div>`;
        html += '</td>';
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('calBody').innerHTML = html;
}

/* ── RENDER WORK LOG (grouped by date) ───────────────── */
function renderDetail() {
  const entries = getFiltered();
  const container = document.getElementById('detailList');
  if (!entries.length) { container.innerHTML = '<div class="loading">No entries this month</div>'; return; }

  const groups = {};
  entries.forEach(e => { (groups[e.event_date] = groups[e.event_date]||[]).push(e); });

  let html = '';
  Object.keys(groups).sort().forEach(date => {
    const dt      = new Date(date + 'T12:00:00');
    const dayName = DAYS_SHORT[dt.getDay()];
    const isWknd  = dt.getDay() === 0 || dt.getDay() === 6;
    const dateStr = MONTHS_SHORT[dt.getMonth()] + ' ' + dt.getDate();
    const items   = groups[date];

    html += `<div class="date-group">
      <div class="dg-hd">
        <span class="dg-day${isWknd?' wknd':''}">${dayName}</span>
        <span class="dg-date">${dateStr}</span>
        <span class="dg-count">${items.length} task${items.length>1?'s':''}</span>
      </div>`;

    items.forEach(e => {
      const time  = e.start_time ? e.start_time.slice(0,5)+(e.end_time?'–'+e.end_time.slice(0,5):'') : '';
      const badge = e.brand ? `<span class="dbadge bb-${e.brand.replace(/\s/g,'')}">${e.brand}</span>` : '';
      html += `<div class="dentry" draggable="true" ondragstart="dragStart(event,'${e.id}')">
        <div class="dav av-${e.teammate}">${e.teammate[0]}</div>
        <div class="di">
          <div class="di-t">${e.title}</div>
          <div class="di-m">
            ${time?`<span class="di-time">${time}</span>`:''}
            ${e.teammate}${e.event_type?' · '+e.event_type:''}${e.location?' · 📍'+e.location:''}
          </div>
          ${e.notes?`<div class="di-m" style="color:#48484a;margin-top:2px">${e.notes}</div>`:''}
        </div>${badge}
        <button class="del-btn" onclick="calDelEntry(event,'${e.id}')">×</button>
      </div>`;
    });
    html += '</div>';
  });

  container.innerHTML = html;
}

/* ── DRAG & DROP ─────────────────────────────────────── */
function dragStart(event, id) {
  event.dataTransfer.setData('entryId', id);
  event.dataTransfer.effectAllowed = 'move';
}
function calDragOver(event) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  event.currentTarget.classList.add('drag-over');
}
function calDragLeave(event) {
  event.currentTarget.classList.remove('drag-over');
}
async function dropOnDate(event, newDate) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const id = event.dataTransfer.getData('entryId');
  if (!id) return;
  const { error } = await sb.from('team_schedules').update({ event_date: newDate }).eq('id', id);
  if (error) { toast('Error: ' + error.message, 'err'); return; }
  toast('Moved ✓', 'ok'); loadCalData();
}
async function calDelEntry(event, id) {
  event.stopPropagation();
  if (!confirm('Delete this entry?')) return;
  await sb.from('team_schedules').delete().eq('id', id);
  loadCalData(); toast('Deleted');
}

/* ── REALTIME ────────────────────────────────────────── */
sb.channel('ts_live')
  .on('postgres_changes', { event:'*', schema:'public', table:'team_schedules' }, () => {
    if (document.getElementById('page-calendar').classList.contains('active')) loadCalData();
    if (selectedTM) loadMyEntries();
  })
  .subscribe();

document.getElementById('date_from').min   = '2026-06-01';
document.getElementById('date_from').value = todayStr > '2026-06-01' ? todayStr : '2026-06-01';
document.getElementById('date_to').min     = '2026-06-01';
document.getElementById('date_to').value   = document.getElementById('date_from').value;

loadCalData();
</script>
